<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <!-- css external -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

      <!--navbar-->
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
        <a class="navbar-brand" href="#">Guest Book</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About Us</a>
            </li>
          </ul>
         </div>
        </div>
      </nav>

      <main class="container mt-5">
  <div class="row">


    <!-- Leave Message -->
    <div class="col-md-4 mb-4">
      <div class="card">

        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Leave Message</h5>
        </div>

        <div class="card-body">

            <form id="guestForm">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="fullName"
                placeholder="Enter your full name"
                required
              >
            </div>

            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                class="form-control"
                id="message"
                rows="5"
                placeholder="Write your message here"
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Submit Message
            </button>
          </form>

        </div>
      </div>
    </div>
    

    <!-- Bagian New Messages -->
  <div class="col-md-8 mb-4">
    <div class="card">
      <div class="card-body">

        <h4>New Messages</h4>
        <hr>

        <!-- Tempat pesan -->
        <ul id="messageList" class="list-group"></ul>

      </div>
    </div>
  </div>

    </div>
  </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto custom-footer">
      <div class="container">

        <p class="font-weight-bold mb-3">
          Connect with Us
        </p>

        <div class="mb-3">
          <a href="#" class="text-white mx-2" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin fa-lg"></i>
          </a>

          <a href="#" class="text-white mx-2" aria-label="X">
            <i class="fa-brands fa-x-twitter fa-lg"></i>
          </a>

          <a href="#" class="text-white mx-2" aria-label="Instagram">
            <i class="fa-brands fa-instagram fa-lg"></i>
          </a>

          <a href="#" class="text-white mx-2" aria-label="GitHub">
            <i class="fa-brands fa-github fa-lg"></i>
          </a>
        </div>

        <p class="text-secondary small mb-0">
          &copy; 2026 Interactive Guest Book. All rights reserved.
        </p>

      </div>
    </footer>


    <script src="./assets/scripts/index.js"></script>
</body>
</html>
